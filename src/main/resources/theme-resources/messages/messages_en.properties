# Messages for the Cloudflare Turnstile challenge page (turnstile-challenge.ftl).
# Shipped in the SPI's theme-resources so every login theme -- managed or custom
# -- resolves these keys. Without this bundle Keycloak renders the raw key name
# (e.g. "turnstileChallengeTitle") on the page.
turnstileChallengeTitle=Quick security check
turnstileChallengeFailed=Verification failed, please try again.
turnstileNoScript=JavaScript is required to continue.
