name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package (Keycloak 26.1.4)
        run: mvn -B -Dkeycloak.version=26.1.4 verify

      - name: Compile against Keycloak 26.0.7
        run: mvn -B -Dkeycloak.version=26.0.7 clean compile
